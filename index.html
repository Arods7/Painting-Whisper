<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painting Whisper — هر روز یک شاهکار</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      Painting Whisper
    </div>
    <div class="date" id="dateLabel"></div>
  </header>

  <section class="artwrap" id="artwrap">
    <div class="frame" id="frame">
      <img id="art" alt="">
      <div class="skeleton" id="skeleton"><div class="spin"></div></div>
    </div>
    <aside class="meta">
      <p class="kicker">شاهکارِ امروز — Painting Whisper</p>
      <h1 id="title">—</h1>
      <p class="artist" id="artist"></p>
      <p class="year" id="year"></p>
      <p class="medium" id="medium"></p>
      <div class="actions">
        <button id="btnInfo" type="button">بیشتر بدانید ↗</button>
        <button id="btnShare" type="button">اشتراک‌گذاری</button>
      </div>
      <p class="hint">هر روز، دقیقاً یک نقاشی — برای همه‌ی دنیا یکی.</p>
    </aside>
  </section>

  <footer class="foot">
    تصاویر از مجموعه‌ی متن‌باز موزه‌ی مت (Metropolitan Museum of Art) — همگی مالکیت عمومی.
  </footer>
</main>

<div class="toast" id="toast">لینک امروز کپی شد ✓</div>
<script src="script.js"></script>
</body>
</html>
